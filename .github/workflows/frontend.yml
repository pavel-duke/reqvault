name: Frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить стиль
        run: npm run lint
      - name: Проверить типы
        run: npm run typecheck
      - name: Запустить тесты
        run: npm test
      - name: Собрать frontend
        run: npm run build
